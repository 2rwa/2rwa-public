const E=WadaikoAllEngine,$=id=>document.getElementById(id);let DB=null,CURRENT=null,COMPILED=null,SESSION=null,LAST=null,LAST_BASE_TP=null,AUDIO_CTX=null,AUDIO_SRC=null,RAF=0,TRACK_STATE={};
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function clone(x){return JSON.parse(JSON.stringify(x))}
async function loadDb(){const bytes=Uint8Array.from(atob(DB_GZIP_B64),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('この版はDecompressionStream(gzip)対応ブラウザが必要です');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));DB=JSON.parse(await new Response(stream).text())}
function unique(xs){return [...new Set(xs.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'ja'))}
function fillSelect(el,values,all='すべて'){el.innerHTML=`<option value="">${all}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
function initFilters(){fillSelect($('region'),unique(DB.records.map(r=>r.geo?.macroRegion)),'全地域');fillSelect($('type'),unique(DB.records.map(r=>r.classification?.traditionType)),'全分類');fillSelect($('grade'),unique(DB.records.map(r=>r.accuracy?.evidenceGrade||r.accuracy?.grade)),'全Evidence');for(const id of ['search','region','type','grade'])$(id).addEventListener(id==='search'?'input':'change',rebuildList)}
function filtered(){const q=$('search').value.trim().toLowerCase(),reg=$('region').value,type=$('type').value,grade=$('grade').value;return DB.records.filter(r=>{if(reg&&r.geo?.macroRegion!==reg)return false;if(type&&r.classification?.traditionType!==type)return false;if(grade&&(r.accuracy?.evidenceGrade||r.accuracy?.grade)!==grade)return false;if(q){const hay=[r.name,r.id,r.geo?.prefecture,r.geo?.locality,r.classification?.traditionType,...(r.piece?.aliases||[])].join(' ').toLowerCase();if(!hay.includes(q))return false}return true})}
function rebuildList(){const arr=filtered(),sel=$('preset'),old=CURRENT?.id;sel.innerHTML='';const groups=new Map();for(const r of arr){const g=r.geo?.macroRegion||'Other';if(!groups.has(g))groups.set(g,[]);groups.get(g).push(r)}for(const [g,rs] of groups){const og=document.createElement('optgroup');og.label=g;for(const r of rs){const o=document.createElement('option');o.value=r.id;o.textContent=`${r.geo?.prefecture||''}｜${r.name}`;og.appendChild(o)}sel.appendChild(og)}$('resultCount').textContent=`${arr.length} / ${DB.records.length} records`;if(!arr.length){CURRENT=null;COMPILED=null;SESSION=null;$('summary').innerHTML='<div class="empty">該当プリセットなし</div>';return}const id=arr.some(r=>r.id===old)?old:arr[0].id;sel.value=id;selectRecord(id)}
function badgeClass(policy){if(policy==='app-exact'||/R[234]/.test(CURRENT?.accuracy?.rhythmGrade||''))return'ok';if(policy==='R1-generated-preview'||policy==='editorial-prototype')return'warn';if(policy==='cue-only/silent')return'bad';return''}
function physicalTracks(){return SESSION?SESSION.tracks.filter(t=>E.isPhysicalDrumFamily(t.synthFamily||E.instrumentFamily(t.instrumentId||t.sourceInstrumentName))):[]}
function metadataEnsemble(){return (CURRENT?.ensemble||[]).filter(x=>!E.isPhysicalDrumFamily(E.instrumentFamily(x)))}
function displayInstrument(x){const raw=String(x||''),fam=E.instrumentFamily(raw),label=E.instrumentLabelJa(raw);if(E.isMelodicFamily(fam))return `${label}（音階・旋律のため非再生）`;if(fam==='percussion_unsupported')return `${label}（現行大太鼓モデルとの物理差が大きいため非再生）`;return label}
function displayTrack(t){const fam=t.synthFamily||E.instrumentFamily(t.instrumentId||t.sourceInstrumentName);if(fam==='odaiko'&&(t.role==='generated_generic_odaiko_preview'||t.inferenceReason))return '大太鼓（資料上の太鼓を代用）';return E.instrumentLabelJa(t.sourceInstrumentName||t.instrumentId||t.id)}
function playbackMethodLabel(t){const fam=t.synthFamily||E.instrumentFamily(t.instrumentId||t.sourceInstrumentName);if(fam==='odaiko'&&(t.role==='generated_generic_odaiko_preview'||t.inferenceReason))return '大太鼓代用';if(fam==='odaiko')return '大太鼓物理音源';return '大太鼓物理コア派生'}
function policyLabel(c=COMPILED){if(!c)return'';if(c.policy==='app-exact')return'既存物理太鼓';if(!c.physicalEventCount)return'資料のみ・非再生';if(c.sequence.tracks.some(t=>t.role==='generated_generic_odaiko_preview'||t.inferenceReason))return'大太鼓代用・生成リズム';if(c.policy==='R1-generated-preview')return'物理太鼓派生・生成リズム';if(c.policy==='editorial-prototype')return'物理太鼓・編集試作';return c.policy}
function silentReason(){const xs=CURRENT?.ensemble||[],f=xs.map(x=>E.instrumentFamily(x));if(f.some(x=>E.isMelodicFamily(x)))return'音階・旋律を必要とする楽器は未検証の音高機能を使わず非再生です';if(f.includes('percussion_unsupported'))return'現行大太鼓物理モデルから物理的に離れる打楽器は非再生です';return'大太鼓または近い膜打楽器として再生できる根拠が不足しています'}
function physicalTrackIds(){return new Set(physicalTracks().map(t=>t.id))}
function sourceFor(id){return DB.sources?.[id]||null}
function updateSummary(){if(!CURRENT||!COMPILED||!SESSION)return;const r=CURRENT,c=COMPILED,s=SESSION,ev=r.accuracy?.evidenceGrade||r.accuracy?.grade||'?',rg=r.accuracy?.rhythmGrade||r.accuracy?.grade||'?',meter=(s.meterMap||[]).map(x=>`${x.numerator}/${x.denominator}${x.grouping?.length?'('+x.grouping.join('+')+')':''}`).join(' → '),tempo=(s.tempoMap||[]).map(x=>`${Math.round(x.qpm)}${x.curve==='linear'?'↗':''}`).join(' → '),meta=metadataEnsemble();$('summary').innerHTML=`<div class="presetName">${esc(r.name)}</div><div class="meta">${esc(r.geo?.prefecture||'')} ${esc(r.geo?.locality||'')} · ${esc(r.classification?.traditionType||'')}</div><div class="badges"><span class="badge ${badgeClass(c.policy)}">${esc(policyLabel(c))}</span><span class="badge">Evidence ${esc(ev)}</span><span class="badge">Rhythm ${esc(rg)}</span><span class="badge ok">再生 ${c.physicalTrackCount} tr / ${c.physicalEventCount} ev</span>${meta.length?`<span class="badge warn">非再生資料 ${meta.length}</span>`:''}</div><div class="meta">拍子: ${esc(meter||'不明')}<br>Tempo: ${esc(tempo||'不明')} QPM · Length ${esc(s.lengthQn)} QN${meta.length?`<br>資料上の非再生楽器: ${esc(meta.map(displayInstrument).join(' / '))}`:''}</div>`}
function selectRecord(id){const r=DB.records.find(x=>x.id===id);if(!r)return;stop();CURRENT=r;COMPILED=E.compileRecord(r);SESSION=clone(COMPILED.sequence);TRACK_STATE=Object.fromEntries(physicalTracks().map(t=>[t.id,{mute:false,gainDb:0}]));LAST=null;LAST_BASE_TP=null;$('wav').disabled=true;$('cached').disabled=true;updateSummary();drawTimeline();drawMixer();drawGrid();updateDetail();const playable=COMPILED.physicalEventCount>0;$('render').disabled=!playable;if(playable)setStatus(`${policyLabel(COMPILED)} — ${COMPILED.physicalTrackCount} track / ${COMPILED.physicalEventCount} events`,'ok');else setStatus(`資料のみ — ${silentReason()}`,'warn');updateMasterRisk()}
function updateDetail(){if(!CURRENT)return;const r=CURRENT,c=COMPILED,s=SESSION,phys=physicalTracks(),meta=metadataEnsemble(),src=(r.sourceRefs||[]).map(id=>{const x=sourceFor(id);if(!x)return`<div class="source"><b>${esc(id)}</b><div>source record missing</div></div>`;const link=x.url?`<a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.url)}</a>`:'';return`<div class="source"><b>${esc(x.publisher||id)} — ${esc(x.title||'')}</b><div>${esc(x.evidence||'')}</div>${link}</div>`}).join('');$('detailBody').innerHTML=`<h3>再生ポリシー</h3><p><b>このリズムマシンの主役は、元から作り込んだ大太鼓物理音源です。</b> TaikoSynthCoreとWASMはGolden Referenceとして固定します。資料で太鼓の種類が未同定でも「太鼓」「太鼓踊り」等の根拠があれば<b>大太鼓そのもの</b>でリズムを代用します。中太鼓・締太鼓・桶胴・羯鼓・チヂン・パーランクー等、膜打楽器として物理的に近いものだけ大太鼓物理コア派生を使います。鼓・鉦・ささら・拍子木など現行モデルから大きく外れる打楽器は無理に似せず非再生です。笛・弦・歌など音階・旋律を必要とする楽器は、大太鼓側の音高関連パラメータが未検証のため一切使用しません。</p><h3>Record</h3><p><b>ID:</b> ${esc(r.id)}<br><b>Playback:</b> ${esc(policyLabel(c))}<br><b>Evidence:</b> ${esc(r.accuracy?.evidenceGrade||r.accuracy?.grade)}<br><b>Rhythm:</b> ${esc(r.accuracy?.rhythmGrade||'')}<br><b>rhythmTranscription:</b> ${esc(r.accuracy?.rhythmTranscription??0)}</p><h3>地域・分類</h3><p>${esc(r.geo?.macroRegion)} / ${esc(r.geo?.prefecture)} / ${esc(r.geo?.locality)}<br>${esc(r.classification?.traditionType)} · ${esc(r.classification?.performanceContext)}</p><h3>資料上の編成</h3><p>${esc((r.ensemble||[]).map(displayInstrument).join(' / ')||'資料上の編成情報なし')}</p><h3>大太鼓物理コアで再生</h3><p>${esc(phys.map(t=>`${displayTrack(t)}［${playbackMethodLabel(t)}］`).join(' / ')||'なし')}</p><h3>資料として保持・非再生</h3><p>${esc(meta.map(displayInstrument).join(' / ')||'なし')}</p><h3>Sequence</h3><p>再生 tracks: ${phys.length}, events: ${c.physicalEventCount}, length: ${esc(s.lengthQn)} QN<br>sections: ${esc(s.sections.map(x=>x.label||x.id).join(' → ')||'none')}</p><h3>正確度</h3><p>${esc(r.accuracy?.note||'')}<br>R1生成パターンは正式採譜ではありません。音階パートや物理差の大きい打楽器は生成しません。</p><h3>Sources</h3>${src||'<p>なし</p>'}`}
function openDetail(){updateDetail();$('detail').classList.add('open')}function closeDetail(){$('detail').classList.remove('open')}
function meterPositions(){return SESSION?.meterMap||[]}
function drawTimeline(){const cv=$('timeline');if(!SESSION)return;const dpr=Math.min(2,devicePixelRatio||1),w=Math.max(320,cv.clientWidth||560),tracks=physicalTracks().slice(0,10),laneH=24,h=26+Math.max(1,tracks.length)*laneH;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.height=h+'px';const g=cv.getContext('2d');g.scale(dpr,dpr);g.fillStyle='#0b0d11';g.fillRect(0,0,w,h);const left=92,right=8,span=w-left-right,L=Math.max(.001,E.rat(SESSION.lengthQn));g.font='10px system-ui';g.textBaseline='middle';if(!tracks.length){g.fillStyle='#aab3c1';g.fillText('物理太鼓パートなし',12,24);return}for(let i=0;i<tracks.length;i++){const y=25+i*laneH;g.fillStyle='#9da7b4';g.fillText(displayTrack(tracks[i]).slice(0,14),4,y);g.strokeStyle='#252b34';g.beginPath();g.moveTo(left,y+laneH/2);g.lineTo(w-right,y+laneH/2);g.stroke()}for(const m of meterPositions()){const x=left+E.rat(m.atQn)/L*span;g.strokeStyle='#46505d';g.beginPath();g.moveTo(x,12);g.lineTo(x,h);g.stroke();g.fillStyle='#7f8a99';g.fillText(`${m.numerator}/${m.denominator}`,x+2,8)}const idx=new Map(tracks.map((t,i)=>[t.id,i]));for(const e of SESSION.events){const i=idx.get(e.trackId);if(i==null)continue;const x=left+E.rat(e.atQn)/L*span,y=25+i*laneH;g.fillStyle='#d17c4f';const hh=4+((e.velocity||80)/127)*10;g.fillRect(Math.max(left,x-1.5),y-hh/2,3,hh)}g.fillStyle='#7f8a99';g.fillText('0',left,h-7);g.fillText(`${SESSION.lengthQn} QN`,w-48,h-7)}
function drawMixer(){const root=$('mixer');root.innerHTML='';const tracks=physicalTracks();if(!tracks.length){root.innerHTML='<div class="empty">大太鼓または対応可能な膜打楽器パートなし。資料は詳細画面に保持しています。</div>';return}for(const t of tracks){const st=TRACK_STATE[t.id]||{mute:false,gainDb:0},row=document.createElement('div');row.className='mixerRow';const n=document.createElement('div');n.className='mixerName';n.innerHTML=`${esc(displayTrack(t))}<small>${esc(playbackMethodLabel(t))}</small>`;const m=document.createElement('button');m.className='mute'+(st.mute?' on':'');m.textContent=st.mute?'MUTE':'M';m.onclick=()=>{st.mute=!st.mute;drawMixer();invalidate()};const r=document.createElement('input');r.type='range';r.min=-18;r.max=6;r.step=.5;r.value=st.gainDb;r.oninput=()=>{st.gainDb=+r.value;db.textContent=(st.gainDb>=0?'+':'')+st.gainDb.toFixed(1);invalidate()};const db=document.createElement('div');db.className='mixerDb';db.textContent=(st.gainDb>=0?'+':'')+st.gainDb.toFixed(1);row.append(n,m,r,db);root.appendChild(row)}}
function gridEligible(){const pt=physicalTracks();if(!SESSION||!pt.length||pt.length>4||E.rat(SESSION.lengthQn)!==8||SESSION.meterMap.length!==1||SESSION.meterMap[0].numerator!==4||SESSION.meterMap[0].denominator!==4)return false;return SESSION.events.every(e=>Math.abs(E.rat(e.atQn)*4-Math.round(E.rat(e.atQn)*4))<1e-8)}
function cellValue(e){if(!e)return 0;if(String(e.technique||'').toUpperCase()==='KA')return 4;if((e.velocity||80)>=100)return 3;if((e.velocity||80)<60)return 1;return 2}
function drawGrid(){const box=$('gridBox'),root=$('grid');root.innerHTML='';if(!gridEligible()){box.style.display='none';return}box.style.display='block';for(const t of physicalTracks()){const wrap=document.createElement('div');wrap.className='gridTrack';const h=document.createElement('div');h.className='gridHead';h.textContent=displayTrack(t);const grid=document.createElement('div');grid.className='stepGrid';for(let i=0;i<32;i++){const q=i/4,e=SESSION.events.find(e=>e.trackId===t.id&&Math.abs(E.rat(e.atQn)-q)<1e-8),v=cellValue(e),b=document.createElement('button');b.className='cell';b.dataset.v=v;b.dataset.track=t.id;b.dataset.step=i;b.textContent=v===4?'KA':v?String(v):'';b.onclick=()=>cycleCell(t.id,i);grid.appendChild(b)}wrap.append(h,grid);root.appendChild(wrap)}}
function cycleCell(trackId,i){const q=i/4,idx=SESSION.events.findIndex(e=>e.trackId===trackId&&Math.abs(E.rat(e.atQn)-q)<1e-8),old=idx>=0?cellValue(SESSION.events[idx]):0,nv=(old+1)%5;if(idx>=0)SESSION.events.splice(idx,1);if(nv){SESSION.events.push({trackId,atQn:E.ratStr(q),velocity:nv===1?48:nv===2?80:nv===3?112:88,technique:nv===4?'KA':nv===1?'TSU':'DON'});SESSION.events.sort((a,b)=>E.rat(a.atQn)-E.rat(b.atQn))}drawGrid();drawTimeline();invalidate()}
function sessionCompiled(){const seq=clone(SESSION),tempoScale=+$('tempoScale').value/100,human=+$('humanize').value,ids=physicalTrackIds();seq.tempoMap=seq.tempoMap.map(x=>({...x,qpm:x.qpm*tempoScale}));seq.events=seq.events.filter(e=>ids.has(e.trackId)&&!TRACK_STATE[e.trackId]?.mute).map(e=>{const st=TRACK_STATE[e.trackId]||{gainDb:0},gain=Math.pow(10,st.gainDb/20),v=Math.max(1,Math.min(127,Math.round((e.velocity||80)*gain))),j=human?((E.hash32(`${CURRENT.id}|${e.trackId}|${e.atQn}`)%20001)/10000-1)*human:0;return{...e,velocity:v,microOffsetMs:(e.microOffsetMs||0)+j}});seq.tracks=seq.tracks.filter(t=>ids.has(t.id));return{...COMPILED,sequence:seq,physicalEventCount:seq.events.length,physicalTrackCount:seq.tracks.length}}
function invalidate(){LAST=null;$('wav').disabled=true;$('cached').disabled=true;updateMasterRisk();$('stats').innerHTML=''}
function updateCtl(){const t=+$('tempoScale').value,h=+$('humanize').value,m=+$('master').value;$('tempoText').textContent=t+'%';$('humanText').textContent=h.toFixed(1)+' ms';$('masterText').textContent=(m>=0?'+':'')+m.toFixed(1)+' dB';updateMasterRisk()}
function updateMasterRisk(){const box=$('masterCtl'),risk=$('risk'),note=$('riskNote');box.classList.remove('limit','near');risk.className='risk';if(!(LAST_BASE_TP>0)){risk.textContent='未測定';note.textContent='Render後にTrue Peakを測定。-1 dBTP · ITU-R BS.1770 4× FIR limiterを常時使用。';return}const m=+$('master').value,p=LAST_BASE_TP*Math.pow(10,m/20),db=20*Math.log10(Math.max(1e-12,p)),ceil=Math.pow(10,-1/20);if(p>ceil){box.classList.add('limit');risk.classList.add('limit');risk.textContent='LIMIT';note.textContent=`予測 ${db.toFixed(1)} dBTP：Limiterが必要`;}else if(p>ceil*.78){box.classList.add('near');risk.classList.add('near');risk.textContent='NEAR';note.textContent=`予測 ${db.toFixed(1)} dBTP：ceilingに近い`;}else{risk.classList.add('safe');risk.textContent='SAFE';note.textContent=`予測 ${db.toFixed(1)} dBTP`}}
function setStatus(text,kind=''){$('status').className='status'+(kind?' '+kind:'');$('status').textContent=text}
async function renderCurrent(){if(!CURRENT)return;stop();$('render').disabled=true;setStatus('WASM rendering…');const t0=performance.now();try{const c=sessionCompiled(),r=await E.renderCompiled(c,{C:TaikoSynthCore,taikoRender:odaikoRenderWasm,quality:$('quality').value,tailSec:.9,maxDurationSec:20,loopSafe:true,masterDb:+$('master').value,ceilingDb:-1});LAST=r;LAST_BASE_TP=r.levels.preTruePeak/Math.pow(10,(+$('master').value)/20);$('wav').disabled=false;$('cached').disabled=false;renderStats(r,performance.now()-t0);updateMasterRisk();const lim=r.levels.limiterReductionDb<-.05;setStatus(`${CURRENT.name} / 大太鼓コア ${r.renderedEventCount} events / loop ${r.durationSec.toFixed(2)} s${lim?` / limiter ${r.levels.limiterReductionDb.toFixed(1)} dB`:''}`,lim?'warn':'ok');await playCached()}catch(e){console.error(e);setStatus('ERROR: '+e.message,'bad')}finally{$('render').disabled=false}}
function renderStats(r,ms){const d=20*Math.log10(Math.max(1e-12,r.levels.postTruePeak)),pre=20*Math.log10(Math.max(1e-12,r.levels.preTruePeak));const vals=[['Render',ms.toFixed(0)+'ms'],['Loop',r.durationSec.toFixed(2)+'s'],['Phys ev',r.renderedEventCount],['Pre TP',pre.toFixed(1)+'dBTP'],['Limit',r.levels.limiterReductionDb<-.05?r.levels.limiterReductionDb.toFixed(1)+'dB':'OFF'],['Out TP',d.toFixed(1)+'dBTP']];$('stats').innerHTML=vals.map(x=>`<div class="metric"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}
async function playCached(){if(!LAST)return;if(!AUDIO_CTX)AUDIO_CTX=new (window.AudioContext||window.webkitAudioContext)();await AUDIO_CTX.resume();stopAudioOnly();const b=AUDIO_CTX.createBuffer(2,LAST.left.length,LAST.sampleRate);b.copyToChannel(LAST.left,0);b.copyToChannel(LAST.right,1);const s=AUDIO_CTX.createBufferSource();s.buffer=b;s.loop=true;s.connect(AUDIO_CTX.destination);s.start();AUDIO_SRC=s;const start=AUDIO_CTX.currentTime,dur=LAST.loopDurationSec||LAST.durationSec;const tick=()=>{if(!AUDIO_SRC)return;const sec=(AUDIO_CTX.currentTime-start)%dur,clock=new E.TempoClock(sessionCompiled().sequence.tempoMap);let best=0,bd=1e9;for(let i=0;i<32&&gridEligible();i++){const d=Math.abs(clock.secondsAt(i/4)-sec);if(d<bd){bd=d;best=i}}document.querySelectorAll('.cell.play').forEach(x=>x.classList.remove('play'));if(gridEligible())document.querySelectorAll(`.cell[data-step="${best}"]`).forEach(x=>x.classList.add('play'));RAF=requestAnimationFrame(tick)};tick()}
function stopAudioOnly(){if(AUDIO_SRC)try{AUDIO_SRC.stop()}catch{}AUDIO_SRC=null;if(RAF)cancelAnimationFrame(RAF);RAF=0;document.querySelectorAll('.cell.play').forEach(x=>x.classList.remove('play'))}
function stop(){stopAudioOnly()}
function exportWav(){if(!LAST)return;const ab=E.encodeWavStereo(LAST.left,LAST.right,LAST.sampleRate),blob=new Blob([ab],{type:'audio/wav'}),a=document.createElement('a'),name=CURRENT.id.replace(/[^A-Za-z0-9_-]+/g,'_');a.href=URL.createObjectURL(blob);a.download=`wadaiko_${name}_${$('quality').value}_${$('tempoScale').value}pct.wav`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function boot(){try{setStatus('DB展開・物理太鼓WASM初期化中…');await loadDb();let variant='wasm-simd';try{await odaikoWasmModule('wasm-simd')}catch(e){variant='wasm-scalar';await odaikoWasmModule('wasm-scalar')}window.PREFERRED_WASM=variant;initFilters();$('preset').onchange=()=>selectRecord($('preset').value);for(const id of ['tempoScale','humanize','master'])$(id).oninput=()=>{updateCtl();invalidate()};$('quality').onchange=invalidate;$('info').onclick=openDetail;$('detailClose').onclick=closeDetail;$('render').onclick=renderCurrent;$('cached').onclick=playCached;$('stop').onclick=stop;$('wav').onclick=exportWav;updateCtl();rebuildList();setStatus(`Ready — ${DB.records.length} records / ${Object.keys(DB.sources).length} sources / ${variant} / 大太鼓Golden固定 + 対応膜打楽器のみ`,'ok')}catch(e){console.error(e);setStatus('BOOT ERROR: '+e.message,'bad')}}
boot();
</script></body></html>
