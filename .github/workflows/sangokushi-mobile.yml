name: Sangokushi mobile layout

on:
  push:
    paths:
      - "history/sangokushi-globe/**"
      - "tests/sangokushi-mobile.mjs"
      - ".github/workflows/sangokushi-mobile.yml"
  workflow_dispatch:

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/sangokushi-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/history/sangokushi-globe/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/sangokushi-http.log
          exit 1
      - name: Test mobile layouts
        run: node tests/sangokushi-mobile.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sangokushi-mobile-screenshots
          path: artifacts/mobile/
          if-no-files-found: warn
