name: Build test vector globe Pages preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/vector-globe/build/**'
      - 'tests/vector-globe/index.html'
      - 'tests/vector-globe/app.js'
      - 'tests/vector-globe/favicon.svg'
      - 'tests/vector-globe/PREVIEW_REQUEST.json'
      - '.github/workflows/test-vector-globe-build.yml'

permissions:
  contents: write

concurrency:
  group: test-vector-globe-build
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GSHHG_VERSION: '2.3.7'
      GSHHG_ASSET: 'gshhg-shp-2.3.7.zip'
      SOURCE_ARCHIVE: '.cache/gshhg/source/gshhg-shp-2.3.7.zip'
      OUT_DIR: 'tests/vector-globe/data'
      GLOBAL_TMP: '.cache/vector-globe-global-all'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install vector toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests fiona shapely pyproj numpy mapbox-earcut

      - name: Restore GSHHG source cache
        uses: actions/cache@v4
        with:
          path: .cache/gshhg/source
          key: test-vector-globe-gshhg-${{ env.GSHHG_VERSION }}

      - name: Download pinned GSHHG release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/gshhg/source
          python tests/vector-globe/build/download_gshhg.py \
            --repository GenericMappingTools/gshhg-gmt \
            --tag "$GSHHG_VERSION" \
            --asset "$GSHHG_ASSET" \
            --output "$SOURCE_ARCHIVE"

      - name: Restore generated global tile cache
        id: world-cache
        uses: actions/cache@v4
        with:
          path: .cache/vector-globe-global-all
          key: test-vector-globe-world-v1-${{ env.GSHHG_VERSION }}-${{ hashFiles('tests/vector-globe/build/build_gshhg_tiles.py', 'tests/vector-globe/build/build_tiles.py', 'tests/vector-globe/build/bundle_delivery.py', 'tests/vector-globe/build/validate_tiles.py') }}

      - name: Build global LOD0-LOD4 on cache miss
        if: steps.world-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$GLOBAL_TMP" .cache/gshhg/extracted-global-all
          python tests/vector-globe/build/build_gshhg_tiles.py \
            --archive "$SOURCE_ARCHIVE" \
            --output "$GLOBAL_TMP" \
            --bbox=-180,-90,180,90 \
            --tile-deg 10 \
            --resolutions c,l,i,h,f \
            --extract-dir .cache/gshhg/extracted-global-all

      - name: Assemble global preview
        run: |
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          cp -a "$GLOBAL_TMP"/. "$OUT_DIR"/
          cp "$SOURCE_ARCHIVE.json" "$OUT_DIR/source.json"
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("tests/vector-globe/data/manifest.json")
          m = json.loads(p.read_text())
          m["preview"] = {
              "status": "complete-for-1000-percent-goal",
              "globalLods": [0, 1, 2, 3, 4],
              "fullLod4BBox": [-180, -90, 180, 90],
              "pagesPath": "/2rwa-public/tests/vector-globe/",
              "goal": "global full-resolution display comparable to the validated Japan 1000% view"
          }
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Build low-LOD delivery bundles
        run: |
          python tests/vector-globe/build/bundle_delivery.py \
            --data "$OUT_DIR" \
            --schemes 0:360x180,1:90x90,2:30x30,3:20x20

      - name: Keep delivery bundles plus global full LOD4
        run: |
          rm -rf "$OUT_DIR/lod0" "$OUT_DIR/lod1" "$OUT_DIR/lod2" "$OUT_DIR/lod3"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("tests/vector-globe/data/manifest.json")
          m = json.loads(p.read_text())
          m["tiles"] = [tile for tile in m["tiles"] if int(tile["lod"]) == 4]
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Validate published global preview
        run: |
          python tests/vector-globe/build/validate_tiles.py --data "$OUT_DIR" \
            | tee "$OUT_DIR/build-report.json"
          node --check tests/vector-globe/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("tests/vector-globe/data/build-report.json").read_text())
          manifest = json.loads(Path("tests/vector-globe/data/manifest.json").read_text())
          full_tiles = [t for t in manifest["tiles"] if int(t["lod"]) == 4]
          if len(full_tiles) < 400:
              raise SystemExit(f"expected global LOD4 coverage, got only {len(full_tiles)} tiles")
          if report["repositoryBytes"] > 300 * 1024 * 1024:
              raise SystemExit(f"published dataset unexpectedly large: {report['repositoryBytes']}")
          print(f"global LOD4 tiles: {len(full_tiles)}")
          print(f"published data: {report['repositoryMiB']} MiB")
          PY
          du -sh "$OUT_DIR"

      - name: Commit generated global preview data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add -A tests/vector-globe/data
          if git diff --cached --quiet; then
            echo 'No preview data changes.'
          else
            git commit -m 'Build global full-resolution vector globe data'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: test-vector-globe-global-report
          path: |
            tests/vector-globe/data/manifest.json
            tests/vector-globe/data/build-report.json
            tests/vector-globe/data/source.json
          if-no-files-found: error
