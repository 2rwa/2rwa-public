name: Build test vector globe Pages preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/vector-globe/build/**'
      - 'tests/vector-globe/PREVIEW_REQUEST.json'
      - '.github/workflows/test-vector-globe-build.yml'

permissions:
  contents: write

concurrency:
  group: test-vector-globe-build
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GSHHG_VERSION: '2.3.7'
      GSHHG_ASSET: 'gshhg-shp-2.3.7.zip'
      SOURCE_ARCHIVE: '.cache/gshhg/source/gshhg-shp-2.3.7.zip'
      CACHE_DIR: '.cache/vector-globe-world-final'
      OUT_DIR: 'tests/vector-globe/data'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install vector toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests fiona shapely pyproj numpy mapbox-earcut
          npm install --no-save playwright-core@1.55.0

      - name: Restore GSHHG source cache
        uses: actions/cache@v4
        with:
          path: .cache/gshhg/source
          key: test-vector-globe-gshhg-${{ env.GSHHG_VERSION }}

      - name: Download pinned GSHHG release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/gshhg/source
          python tests/vector-globe/build/download_gshhg.py \
            --repository GenericMappingTools/gshhg-gmt \
            --tag "$GSHHG_VERSION" \
            --asset "$GSHHG_ASSET" \
            --output "$SOURCE_ARCHIVE"

      - name: Restore final global tile cache
        id: world-cache
        uses: actions/cache@v4
        with:
          path: .cache/vector-globe-world-final
          key: test-vector-globe-world-v3-${{ env.GSHHG_VERSION }}-${{ hashFiles('tests/vector-globe/build/build_gshhg_tiles.py', 'tests/vector-globe/build/build_tiles.py', 'tests/vector-globe/build/bundle_delivery.py', 'tests/vector-globe/build/validate_tiles.py') }}

      - name: Build all five global LODs on cache miss
        if: steps.world-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$CACHE_DIR" .cache/gshhg/extracted-world-final
          python tests/vector-globe/build/build_gshhg_tiles.py \
            --archive "$SOURCE_ARCHIVE" \
            --output "$CACHE_DIR" \
            --bbox=-180,-90,180,90 \
            --tile-deg 10 \
            --resolutions c,l,i,h,f \
            --extract-dir .cache/gshhg/extracted-world-final
          cp "$SOURCE_ARCHIVE.json" "$CACHE_DIR/source.json"
          python tests/vector-globe/build/bundle_delivery.py \
            --data "$CACHE_DIR" \
            --schemes 0:360x180,1:90x90,2:30x30,3:20x20
          python tests/vector-globe/build/validate_tiles.py --data "$CACHE_DIR" \
            > "$CACHE_DIR/build-report-full-cache.json"

      - name: Assemble published data
        run: |
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          cp -a "$CACHE_DIR"/. "$OUT_DIR"/
          rm -rf "$OUT_DIR/lod0" "$OUT_DIR/lod1" "$OUT_DIR/lod2" "$OUT_DIR/lod3"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("tests/vector-globe/data/manifest.json")
          m = json.loads(p.read_text())
          m["tiles"] = [tile for tile in m["tiles"] if int(tile["lod"]) == 4]
          m["preview"] = {
              "status": "complete-for-1000-percent-goal",
              "globalLods": [0, 1, 2, 3, 4],
              "fullLod4BBox": [-180, -90, 180, 90],
              "pagesPath": "/2rwa-public/tests/vector-globe/",
              "goal": "global full-resolution display comparable to the validated Japan 1000% view",
              "antarcticaRepair": "EPSG:3031 polar union before tile clipping"
          }
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Validate published global data
        run: |
          python tests/vector-globe/build/validate_tiles.py --data "$OUT_DIR" \
            | tee "$OUT_DIR/build-report.json"
          node --check tests/vector-globe/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("tests/vector-globe/data/manifest.json").read_text())
          r = json.loads(Path("tests/vector-globe/data/build-report.json").read_text())
          full = [t for t in m["tiles"] if int(t["lod"]) == 4]
          polar = [t for t in full if float(t["bounds"][1]) == -90.0]
          if len(full) < 400:
              raise SystemExit(f"expected global LOD4 coverage, got {len(full)} tiles")
          if len(polar) != 36:
              raise SystemExit(f"expected 36 south-pole LOD4 tiles, got {len(polar)}")
          if r["repositoryBytes"] > 300 * 1024 * 1024:
              raise SystemExit(f"published dataset unexpectedly large: {r['repositoryBytes']}")
          print(f"global LOD4 tiles: {len(full)}")
          print(f"south-pole LOD4 tiles: {len(polar)}")
          print(f"published data: {r['repositoryMiB']} MiB")
          PY

      - name: Browser QA before commit
        run: |
          python3 -m http.server 8125 --bind 127.0.0.1 >/tmp/vector-globe-final-http.log 2>&1 &
          mkdir -p /tmp/vector-globe-final-qa
          node tests/vector-globe/final_qa.mjs \
            http://127.0.0.1:8125/tests/vector-globe/ \
            /tmp/vector-globe-final-qa

      - name: Commit generated global data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tests/vector-globe/data
          if git diff --cached --quiet; then
            echo 'No generated data changes.'
          else
            git commit -m 'Repair Antarctica and rebuild global vector globe'
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-globe-final-build-qa
          path: |
            tests/vector-globe/data/manifest.json
            tests/vector-globe/data/build-report.json
            /tmp/vector-globe-final-qa/*.png
            /tmp/vector-globe-final-http.log
          if-no-files-found: warn
